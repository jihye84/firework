<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>불꽃 연출 디자이너</title>
<script>
/* 카카오톡·네이버·페이스북·인스타그램 등 인앱 브라우저에서 열리면 기본 브라우저로 다시 열기 */
(function () {
  var ua = navigator.userAgent || '';
  var url = location.href;
  var inApp = /KAKAOTALK|NAVER\(inapp|FBAN|FBAV|FB_IAB|Instagram|Line\/|DaumApps|everytimeApp|wv\)/i.test(ua);
  if (/KAKAOTALK/i.test(ua)) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url); return; }
  if (/Line\//i.test(ua) && url.indexOf('openExternalBrowser=1') < 0) {
    location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1'; return;
  }
  if (!inApp) return;
  if (/Android/i.test(ua)) {
    location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end'; return;
  }
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('div');
    box.setAttribute('role', 'dialog');
    box.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(13,17,32,.94);color:#eef0f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:15px/1.6 system-ui,sans-serif';
    box.innerHTML = '<strong style="font-size:18px">사파리에서 열어 주세요</strong>' +
      '<span>이 앱 안의 브라우저에서는 일부 기능이 제대로 작동하지 않을 수 있어요.<br>⋯ 메뉴에서 <b>Safari로 열기</b>를 눌러 주세요.</span>' +
      '<button id="copyUrl" style="font:inherit;padding:10px 18px;border-radius:999px;border:0;background:#eef0f8;color:#0d1120">주소 복사</button>' +
      '<button id="stayHere" style="font:inherit;background:none;border:0;color:#9aa3c0;text-decoration:underline">그냥 여기서 보기</button>';
    document.body.appendChild(box);
    document.getElementById('copyUrl').onclick = function () {
      var b = this;
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
        function () { b.textContent = '복사했어요'; }, function () { prompt('주소를 복사하세요', url); });
    };
    document.getElementById('stayHere').onclick = function () { box.remove(); };
  });
})();
</script>
<style>
:root{--bg:#060914;--panel:#0e1324;--panel2:#161d33;--line:#232c47;--ink:#e9ecf6;--dim:#8d96b4;--acc:#ffc657;--acc2:#5ad1ff;--danger:#ff7070}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-height:32px;white-space:nowrap}
button:hover{border-color:#3a4670}
button.on{background:#3a2f12;border-color:var(--acc);color:var(--acc)}
input[type=text],input[type=number],input:not([type]){background:#0a0e1c;border:1px solid var(--line);border-radius:8px;padding:0 8px;min-height:32px;min-width:0}
input[type=range]{accent-color:var(--acc);min-width:0}
.dim{color:var(--dim)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app{height:100%;display:grid;grid-template-columns:100%;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"head" "stage" "time" "bar"}
header{grid-area:head;display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:#0a0f1e;border-bottom:1px solid var(--line);min-height:46px}
.brand{font-weight:800;font-size:15px;color:var(--acc);white-space:nowrap;letter-spacing:-.3px}
.hgrp{display:flex;align-items:center;gap:6px}
.hgrp.right{margin-left:auto}
.ib{min-width:36px;padding:0;font-size:16px}
#tm{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.tap{background:linear-gradient(#ffcf6e,#f0a52e);color:#2a1800;border-color:#ffd88a;font-weight:800}
.tap:active{transform:scale(.97)}
#stage{grid-area:stage;position:relative;min-height:0;overflow:hidden;background:#04060e}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#ytMini{position:absolute;left:8px;top:8px;width:160px;height:90px;display:none;border-radius:8px}
body.ytmini #ytMini{display:block}
#toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-8px);background:#141b30ee;border:1px solid var(--line);border-radius:999px;padding:7px 16px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center;z-index:5}
#toast.show{opacity:1;transform:translate(-50%,0)}
#keys{position:absolute;right:10px;bottom:8px;font-size:12px;color:#8d96b499;pointer-events:none}
#tlWrap{grid-area:time;position:relative;height:clamp(98px,14vh,146px);border-top:1px solid var(--line);background:#090d1a}
#tl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#zoom{position:absolute;right:6px;top:3px;display:flex;gap:4px}
#zoom button{min-height:22px;height:22px;font-size:12px;padding:0 8px;background:#121830cc}
#bar{grid-area:bar;display:grid;grid-template-columns:48px 56px 1.3fr 1fr 1fr;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#0a0f1e;border-top:1px solid var(--line)}
#bar button{min-height:48px;font-size:15px}
#sheet{position:fixed;left:0;right:0;bottom:0;height:min(64vh,560px);background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .25s;z-index:30;display:flex;flex-direction:column;box-shadow:0 -10px 30px #000a}
body.open #sheet{transform:none}
#sheetTabs{display:flex;gap:4px;padding:8px 8px 0}
#sheetTabs button{flex:1;min-height:36px}
#sheetTabs #sheetClose{flex:0 0 44px}
.panel{flex:1;min-height:0;padding:8px 12px 10px;display:none;flex-direction:column;gap:7px;overflow:hidden}
body[data-s="L"] #panelL,body[data-s="A"] #panelR,body[data-s="B"] #panelR{display:flex}
.panel h3{display:none}
#panelL .sep{border-top:1px solid var(--line);margin-top:3px;padding-top:7px}
.row{display:flex;gap:6px;align-items:center;min-width:0}
.row>input{flex:1}
.row.g3>button{flex:1;padding:0 4px}
.slot{width:100%;aspect-ratio:16/9;max-height:19vh;border-radius:8px;background:#05070f;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--dim)}
#ytBox{position:fixed;z-index:31;display:none;border-radius:8px;overflow:hidden;background:#000}
#ytBox .yp,#ytBox iframe{position:absolute;inset:0;width:100%;height:100%;display:block;border:0}
#ytBox .yp{opacity:0;pointer-events:none}#ytBox .yp.on{opacity:1;pointer-events:auto}
.seg{display:flex;gap:3px;flex:1;min-width:0}
.seg button{flex:1;padding:0 2px;font-size:13px;min-width:0}
.ptabs{display:none;gap:4px}
.ptabs button{flex:1}
.edit{display:flex;align-items:center;gap:6px;min-height:30px}
.edit #editLbl{flex:1;font-size:13px}
.edit button{min-height:28px;font-size:12px}
.edit .sel{color:var(--acc2)}
button.danger{color:var(--danger)}
.pt{display:none;flex-direction:column;gap:7px;min-height:0}
body[data-p="A"] .pt[data-p="A"],body[data-p="B"] .pt[data-p="B"]{display:flex}
.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.shapes button{height:clamp(48px,7vh,62px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 0;gap:1px;font-size:12px}
.shapes button canvas{width:30px;height:30px;flex:0 0 auto}
.shapes.br button{height:clamp(64px,10vh,84px);font-size:13px}
.shapes.br button canvas{width:44px;height:36px}
.lbl{font-size:12px;color:var(--dim);margin-top:2px}
.sw{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.sw button{height:26px;min-height:26px;padding:0;border-radius:6px;border:2px solid transparent}
.sw button.on{border-color:#fff;box-shadow:0 0 0 1px #000 inset}
.frow{display:flex;align-items:center;gap:8px;min-height:30px}
.frow>span{flex:0 0 58px;font-size:13px;color:var(--dim)}
.frow input[type=range]{flex:1}
.frow b{flex:0 0 46px;text-align:right;font-weight:500;font-variant-numeric:tabular-nums;font-size:13px}
.frow.col{flex-direction:column;align-items:stretch;gap:3px}
.frow.col>span{flex:none;font-size:12px}
.frow .seg button{min-height:30px}
.frow #it{width:80px;flex:0 0 80px;text-align:center}
.frow button[data-nudge]{min-height:30px;font-size:12px}
.tgs{display:flex;gap:5px}
.tgs button{flex:1;padding:0 2px;font-size:13px}
.pact{display:none;gap:6px;margin-top:auto}
.pact button{flex:1;min-height:42px;font-size:14px}
.foot{font-size:12px;margin-top:auto}
.ced{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:7px;min-height:100px}
.cedhint{font-size:12px;color:var(--dim);line-height:1.45}
.cedbody{display:none;flex-direction:column;gap:4px}
.ced.has .cedhint{display:none}.ced.has .cedbody{display:flex}
.cedhead{display:flex;align-items:center;gap:4px;font-size:12px;min-height:28px}
.cedhead>span{flex:1;min-width:0;font-variant-numeric:tabular-nums}
#cedTitle{font-size:13px;font-weight:600;color:var(--acc)}
.cedhead button{min-height:28px;font-size:12px;padding:0 8px}
.cliphead{display:flex;align-items:center;gap:5px;font-size:12px}
.cliphead #clipLbl{flex:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.cliprow{display:flex;align-items:center;gap:4px}.cliprow button{min-height:28px;font-size:12px;padding:0 6px}.cliprow .dual{flex:1}
.dual{position:relative;height:30px;touch-action:none;min-width:0}
.dual .trk{position:absolute;left:9px;right:9px;top:13px;height:4px;border-radius:2px;background:#232c47}
.dual .fill{position:absolute;top:0;bottom:0;background:var(--acc);border-radius:2px}
.dual input{position:absolute;left:0;right:0;top:0;width:100%;height:30px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input::-webkit-slider-runnable-track{background:none;height:30px}
.dual input::-moz-range-track{background:none}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;margin-top:6px;border-radius:50%;background:var(--acc);border:2px solid #fff;cursor:grab}
.dual input::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:var(--acc);border:2px solid #fff;cursor:grab}
@media not all and (min-width:1200px) and (min-aspect-ratio:8/5){#panelL .slot{max-height:9vh}#panelL .foot{display:none}#panelL{gap:7px;padding-top:10px}}
.wideonly{display:none!important}
@media (min-width:1200px) and (min-aspect-ratio:8/5){
  #app{grid-template-columns:272px minmax(0,1fr) 318px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head head head" "left stage right" "time time time"}
  #bar,#sheetTabs,.narrowonly{display:none!important}
  .wideonly{display:flex!important}
  #sheet{display:contents}
  #sheet #panelL,#sheet #panelR{display:flex}
  #panelL{grid-area:left;border-right:1px solid var(--line);background:var(--panel)}
  #panelR{grid-area:right;border-left:1px solid var(--line);background:var(--panel)}
  #panelR .ptabs,#panelR .pact{display:flex}
  header{padding:6px 14px}
  .brand{font-size:17px;width:250px}
  #bTap{min-height:36px;padding:0 18px;margin-left:12px}
}
</style>
</head>
<body data-s="A" data-p="A">
<div id="app">
  <header>
    <div class="brand">불꽃 연출 디자이너</div>
    <div class="hgrp">
      <button id="bHome" class="ib wideonly" title="처음으로">⏮</button>
      <button id="bPlay" class="ib wideonly" title="재생 / 멈춤 (Space)">▶</button>
      <div id="tm">0:00.0</div>
    </div>
    <button id="bTap" class="tap wideonly" title="음악을 들으며 박자에 맞춰 누르기 (Enter)">● 탭! 여기서 터뜨리기</button>
    <div class="hgrp right">
      <button id="bUndo" class="ib" title="되돌리기 (Ctrl+Z)">↶</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="ytMini"></div>
    <div id="toast"></div>
    <div id="keys" class="wideonly">Space 재생 · Enter 탭 · P 미리보기 · Del 지우기 · ←→ 옮기기</div>
  </div>

  <div id="sheet">
    <div id="sheetTabs">
      <button data-s="L">음악</button><button data-s="A">모양·색</button><button data-s="B">크기·패턴</button><button id="sheetClose">✕</button>
    </div>

    <section id="panelL" class="panel">
      <div class="row"><input id="ytUrl" placeholder="유튜브 주소 (검색어도 돼요)"><button id="bYt">＋ 곡 추가</button></div>
      <div id="ytSlot" class="slot">곡을 추가하면<br>여기에 영상이 나와요</div>
      <div class="ced" id="ced">
        <div class="cedhint" id="cedHint">곡을 추가하면 타임라인 맨 윗줄에<br>차례로 이어 붙어요.<br>줄에서 곡을 누르면 여기서 자르고,<br>끌어서 순서를 바꿀 수 있어요.</div>
        <div class="cedbody" id="cedBody">
          <div class="cedhead"><span id="cedTitle" class="ell"></span><button id="bCPrev" title="앞으로">◀</button><button id="bCNext" title="뒤로">▶</button><button id="bCDel" class="danger" title="이 곡 빼기">✕</button></div>
          <div class="cedhead"><span id="clipLbl" class="dim"></span><button id="bListen" style="min-width:92px">▶ 구간 듣기</button></div>
          <div class="cliprow"><button id="bClipA" title="지금 들리는 곳을 시작으로">시작=지금</button><div class="dual"><div class="trk"><div class="fill" id="clipFill"></div></div><input type="range" id="clipA" min="0" max="300" step="0.1" value="0" aria-label="구간 시작"><input type="range" id="clipB" min="0" max="300" step="0.1" value="60" aria-label="구간 끝"></div><button id="bClipB" title="지금 들리는 곳을 끝으로">끝=지금</button></div>
        </div>
      </div>
      <div class="row sep"><span class="dim" style="font-size:13px">BPM</span><input id="bpm" type="number" min="40" max="240" style="width:62px;flex:0 0 62px"><button id="bTempo" style="flex:1">탭 템포</button><button id="bBeat0" style="flex:1" title="지금 위치를 첫 박으로">첫 박=지금</button></div>
      <div class="row"><span class="dim" style="font-size:13px">박자 맞춤</span><div class="seg" id="segSnap"></div></div>
      <div class="row sep g3"><button id="bEx">예시 쇼</button><button id="bNew">새로 만들기</button><button id="bShare">링크 복사</button></div>
      <div class="row g3"><button id="bSave">파일로 저장</button><button id="bLoad">파일 열기</button></div>
      <input type="file" id="fShow" accept=".json,application/json" hidden>
      <div class="row sep g3"><button class="tg" data-o="sound">터지는 소리</button><button class="tg" data-o="reflect">물 반사</button><button class="tg" data-o="smoke">연기</button></div>
      <div class="foot dim" id="count"></div>
    </section>

    <section id="panelR" class="panel">
      <div class="ptabs"><button data-p="A">모양·색</button><button data-p="B">크기·자리·패턴</button></div>
      <div class="edit"><span id="editLbl">새 불꽃 설정</span><button id="bDesel">선택 해제</button><button id="bDel" class="danger">삭제</button></div>
      <div class="pt" data-p="A">
        <div class="seg" id="segSite"></div>
        <div id="shapes" class="shapes"></div>
        <div class="lbl">색</div><div id="sw1" class="sw"></div>
        <div class="lbl" id="lbl2">바뀌는 색 (터진 뒤 색이 변해요)</div><div id="sw2" class="sw"></div>
      </div>
      <div class="pt" data-p="B">
        <div class="frow col" data-show="sky"><span>크기 (호 = 인치)</span><div class="seg" id="segSize"></div></div>
        <div class="frow col" data-show="sky"><span>패턴</span><div class="seg" id="segPat"></div></div>
        <div class="frow col" data-show="bridge"><span>번지는 방향</span><div class="seg" id="segDir"></div></div>
        <div class="frow"><span id="lx">위치</span><input type="range" id="rx" min="0" max="1" step="0.01"><b id="vx"></b></div>
        <div class="frow" data-show="x2"><span id="lx2">끝 위치</span><input type="range" id="rx2" min="0" max="1" step="0.01"><b id="vx2"></b></div>
        <div class="frow" data-show="n"><span>발 수</span><input type="range" id="rn" min="2" max="16" step="1"><b id="vn"></b></div>
        <div class="frow" data-show="gap"><span>간격</span><input type="range" id="rgap" min="0.1" max="1.2" step="0.05"><b id="vgap"></b></div>
        <div class="frow" data-show="dur"><span>길이</span><input type="range" id="rdur" min="1" max="30" step="0.5"><b id="vdur"></b></div>
        <div class="frow" data-show="text"><span>글자</span><input id="itext" maxlength="6" style="flex:1"></div>
        <div class="frow" data-show="sel"><span>시각</span><button data-nudge="-0.1">−0.1초</button><input id="it" type="number" step="0.05" min="0"><button data-nudge="0.1">＋0.1초</button></div>
        <div class="tgs"><button class="tg" data-f="mirror" title="강 가운데를 기준으로 좌우 대칭">데칼코마니</button><button class="tg" data-f="tail" data-show="sky">상승 꼬리</button><button class="tg" data-f="glit" data-show="sky">반짝이 꼬리</button></div>
      </div>
      <div class="pact"><button id="bPrev">미리보기 (P)</button><button id="bAdd" class="tap">＋ 지금 시각에 넣기</button></div>
    </section>
  </div>

  <div id="tlWrap"><canvas id="tl"></canvas><div id="zoom"><button data-z="-">−</button><button data-z="+">＋</button><button data-z="all">전체</button></div></div>

  <nav id="bar">
    <button id="mHome">⏮</button><button id="mPlay">▶</button><button id="mTap" class="tap">● 탭!</button><button id="mPrev">미리보기</button><button id="mEdit">편집 ▲</button>
  </nav>
</div>
<div id="ytBox"><div class="yp" id="yp0"></div><div class="yp" id="yp1"></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,f)=>a+(b-a)*f;

/* ───────── 제어 항목 정의 ───────── */
const COLORS={red:['빨강','#ff4242'],orange:['주황','#ff8c2a'],gold:['금빛','#ffc65c'],yellow:['노랑','#fff16a'],green:['초록','#52ff80'],teal:['청록','#3cf2dc'],blue:['파랑','#4d86ff'],purple:['보라','#b965ff'],pink:['분홍','#ff74ca'],white:['은빛','#f3f6ff'],rainbow:['무지개','']};
const SKY_SHAPES=[['chrys','국화'],['peony','모란'],['willow','버들'],['palm','야자'],['ring','링'],['saturn','토성'],['multi','겹꽃'],['crossette','갈래'],['heart','하트'],['star','별'],['square','네모'],['crown','왕관'],['smile','웃음'],['text','글자'],['strobe','반짝'],['crackle','타닥']];
const BR_SHAPES=[['niagara','나이아가라'],['wave','파도 쏘기'],['gerb','분수'],['sparkle','반짝 조명']];

function seeded(s){return()=>{s=(s*16807)%2147483647;return s/2147483647;};}
function drawBG(){

  g.fillStyle='#090d1c';g.beginPath();g.moveTo(W*.52,waterTop);
  for(let i=0;i<=40;i++){const f=i/40,x=W*(.52+.4*f);const y=waterTop-H*.115*Math.pow(Math.sin(Math.PI*f),1.6);g.lineTo(x,y);}g.lineTo(W*.92,waterTop);g.fill();

  let x=0;while(x<W){const bw=W*(.015+R()*.035),bh=H*(.025+R()*.1)*(x>W*.55&&x<W*.9?.55:1);
    g.fillStyle=R()<.5?'#0a0e1d':'#0c1122';g.fillRect(x,waterTop-bh,bw,bh);
    for(let wy=waterTop-bh+3;wy<waterTop-3;wy+=5)for(let wx=x+2;wx<x+bw-2;wx+=4)if(R()<.18){g.fillStyle=`rgba(255,${200+R()*40|0},${130+R()*60|0},${.25+R()*.4})`;g.fillRect(wx,wy,1.6,1.6);}
    x+=bw+R()*3;}
  // 강변 가로등 줄

function samplePoly(v,n,closed){const segs=[];let L=0;const m=closed?v.length:v.length-1;
  for(let i=0;i<m;i++){const a=v[i],b=v[(i+1)%v.length],l=Math.hypot(b[0]-a[0],b[1]-a[1]);segs.push([a,b,l]);L+=l;}
  const o=[];for(let i=0;i<n;i++){let d=(i+.5)/n*L;for(const[a,b,l]of segs){if(d<=l){const f=d/l;o.push([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]);break;}d-=l;}}return o;}
function sphere(n){const o=[],r0=Math.random()*6.28;for(let i=0;i<n;i++){const z=1-2*(i+.5)/n,r=Math.sqrt(1-z*z),th=i*2.39996+r0;o.push([r*Math.cos(th),r*Math.sin(th)]);}return o;}
const ptCache={};
function textPts(str,n){const c=document.createElement('canvas');c.width=420;c.height=130;const g=c.getContext('2d');let fs=104;
  const font=f=>`900 ${f}px system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif`;g.font=font(fs);const w=g.measureText(str).width;if(w>400){fs*=400/w;g.font=font(fs);}
  g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.fillText(str,210,66);
  const d=g.getImageData(0,0,420,130).data,pts=[];for(let y=0;y<130;y+=4)for(let x=(y/4%2)*2;x<420;x+=4)if(d[(y*420+x)*4+3]>140)pts.push([x,y]);
  if(!pts.length)return sphere(n);
  let a=1e9,b=-1e9,c2=1e9,d2=-1e9;pts.forEach(([x,y])=>{a=Math.min(a,x);b=Math.max(b,x);c2=Math.min(c2,y);d2=Math.max(d2,y);});
  const cx=(a+b)/2,cy=(c2+d2)/2,sc=Math.max(b-a,d2-c2)/2||1;let o=pts.map(([x,y])=>[(x-cx)/sc,(y-cy)/sc]);
  if(o.length>n){const k=o.length/n,p=[];for(let i=0;i<n;i++)p.push(o[Math.floor(i*k)]);o=p;}return o;}
function shapePts(shape,n,text){const key=shape+'|'+n+'|'+(text||'');if(ptCache[key])return ptCache[key];let o=[];
  if(shape==='heart'){for(let i=0;i<n;i++){const t=i/n*6.2832,x=16*Math.sin(t)**3,y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);o.push([x/16.5,-y/16.5+.12]);}}
  else if(shape==='star'){const v=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?.42:1;v.push([r*Math.cos(a),r*Math.sin(a)+.08]);}o=samplePoly(v,n,true);}
  else if(shape==='square'){o=samplePoly([[-.78,-.78],[.78,-.78],[.78,.78],[-.78,.78]],n,true);}
  else if(shape==='crown'){o=samplePoly([[-.9,.6],[.9,.6],[.95,-.42],[.47,.08],[0,-.6],[-.47,.08],[-.95,-.42]],Math.round(n*.72),true).concat(samplePoly([[-.86,.32],[.86,.32]],Math.round(n*.12),false));
    [[.95,-.58],[0,-.76],[-.95,-.58]].forEach(([cx,cy])=>{const m=Math.max(4,Math.round(n*.05));for(let i=0;i<m;i++){const a=i/m*6.2832;o.push([cx+.08*Math.cos(a),cy+.08*Math.sin(a)]);}});}
  else if(shape==='smile'){const m1=Math.round(n*.56),m2=Math.max(4,Math.round(n*.06)),m3=n-m1-2*m2;
    for(let i=0;i<m1;i++){const a=i/m1*6.2832;o.push([.95*Math.cos(a),.95*Math.sin(a)]);}
    [[-.34,-.28],[.34,-.28]].forEach(([cx,cy])=>{for(let i=0;i<m2;i++){const a=i/m2*6.2832;o.push([cx+.09*Math.cos(a),cy+.11*Math.sin(a)]);}});
    for(let i=0;i<m3;i++){const a=.45+i/(m3-1)*(Math.PI-.9);o.push([.56*Math.cos(a),.02+.5*Math.sin(a)]);}}
  else if(shape==='text'){o=textPts(text||'★',n);}
  return ptCache[key]=o;}

}
function splitAt(p){const sp=Math.atan2(p.vy,p.vx);[.785,-.785,2.356,-2.356].forEach(d=>{const a=sp+d,v=p.R*.38*2.4;P.push({x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,k:2.4,g:G.H*.08,age:0,life:rand(.9,1.3),spr:p.spr2||p.spr,sz:p.sz*.85,tr:20,trSpr:SPR.ember,ph:0,R:0});});}
function crackleAt(p){for(let i=0;i<5;i++)P.push({x:p.x,y:p.y,vx:rand(-1,1)*G.H*.09,vy:rand(-1,1)*G.H*.09,k:5,g:0,age:0,life:rand(.12,.26),spr:SPR.white,sz:rand(1.6,2.6),ph:0});crackleSnd();}
function flash(x,y,R,col){FL.push({x,y,r:R*2.4,rgb:colRgb(col),age:0,life:.55});if(FL.length>20)FL.shift();}
function smoke(x,y,R){for(let i=0;i<3;i++)SM.push({x:x+rand(-.35,.35)*R,y:y+rand(-.3,.35)*R,r:R*rand(.5,.85),age:0,life:rand(7,11)});while(SM.length>70)SM.shift();}

/* 발사체(상승하는 불꽃) */
function fireShell(e,elapsed){const c=e.cue;const comet=e.kind==='comet';
  const y0=comet?G.deckY-G.deckH:G.bargeY,yb=comet?G.deckY-G.H*rand(.22,.3):G.waterTop-altFor(c.size)*rand(.97,1.03);
  SH.push({x0:e.x0*G.W,xb:e.xb*G.W,y0,yb,rise:e.rise,age:Math.max(0,elapsed),cue:c,comet,x:e.x0*G.W,y:y0});}
function updShells(dt){for(let i=SH.length-1;i>=0;i--){const s=SH[i];s.age+=dt;const f=Math.min(1,s.age/s.rise),e=1-(1-f)*(1-f);
  const nx=lerp(s.x0,s.xb,e),ny=lerp(s.y0,s.yb,e);
  if((s.cue.tail||s.comet)&&f<1&&P.length<CAP){const steps=2;for(let k=0;k<steps;k++)P.push({x:lerp(s.x,nx,k/steps),y:lerp(s.y,ny,k/steps),vx:rand(-6,6),vy:rand(4,22),k:2,g:G.H*.05,age:0,life:rand(.25,.6),spr:s.comet?colSpr(s.cue.c1):SPR.ember,sz:rand(1.2,1.9),ph:0});}
  s.x=nx;s.y=ny;
  if(f>=1){SH.splice(i,1);if(s.comet)explode(s.x,s.y,{size:3,shape:'peony',c1:s.cue.c1,c2:''},{scale:.42,quiet:true});else explode(s.x,s.y,s.cue);}}}

/* 다리 위 연출(계속 뿜어내는 장치) */
function runEmitter(m,t,dt){const c=m.cue,p=(t-m.start)/(m.end-m.start);if(p<0||p>=1||dt<=0)return;
  const r=Math.min(1,p/.3),fade=p>.85?(1-p)/.15:Math.min(1,p*20);const a=m.a,b=m.b,mid=(a+b)/2,h=(b-a)/2;let rs;
  switch(c.dir){case'lr':rs=[[a,a+(b-a)*r]];break;case'rl':rs=[[b-(b-a)*r,b]];break;case'out':rs=[[mid-h*r,mid+h*r]];break;case'in':rs=[[a,a+h*r],[b-h*r,b]];break;default:rs=[[a,b]];}
  const W=G.W;
  for(const[u,v]of rs){const x1=u*W,x2=v*W,span=x2-x1;if(span<1)continue;
    if(c.shape==='niagara'){let cnt=span*dt*1.6*fade;cnt=Math.floor(cnt)+(Math.random()<cnt%1?1:0);
      for(let i=0;i<cnt&&P.length<CAP;i++)P.push({x:rand(x1,x2),y:G.deckY+G.deckH,vx:rand(-5,5),vy:rand(0,18),k:.5,g:G.H*.5,age:0,life:2,spr:colSpr(c.c1),sz:rand(1.5,2.3),wy:G.pierBot,gl:Math.random()<.35?1:0,ph:0});}
    else if(c.shape==='gerb'){const st=W*.07;for(let gx=Math.ceil((x1-st/2)/st)*st+st/2;gx<=x2;gx+=st){let cnt=60*dt*fade;cnt=Math.floor(cnt)+(Math.random()<cnt%1?1:0);
      for(let i=0;i<cnt&&P.length<CAP;i++)P.push({x:gx+rand(-2,2),y:G.deckY-G.deckH*.6,vx:rand(-1,1)*W*.025,vy:-rand(.65,1)*G.H*.3,k:.6,g:G.H*.7,age:0,life:1.4,spr:colSpr(c.c1),sz:rand(1.6,2.5),wy:G.pierBot,ph:0});}}
    else if(c.shape==='sparkle'){let cnt=span/W*40*dt*fade*3;cnt=Math.floor(cnt)+(Math.random()<cnt%1?1:0);
      for(let i=0;i<cnt;i++)P.push({x:rand(x1,x2),y:G.deckY-rand(0,G.deckH*2.2),vx:0,vy:0,k:0,g:0,age:0,life:rand(.08,.18),spr:colSpr(c.c1),sz:rand(3,5.5),ph:0});}}}

function update(dt){
  updShells(dt);
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.age+=dt;
    if(p.sp&&p.age>=p.sp){splitAt(p);p.age=p.life;}
    if(p.age>=p.life||(p.wy&&p.y>p.wy)){if(p.cr)crackleAt(p);P[i]=P[P.length-1];P.pop();continue;}
    const e=Math.exp(-p.k*dt);p.vx*=e;p.vy=p.vy*e+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.tr&&P.length<CAP&&Math.random()<p.tr*dt)P.push(ember(p));}
  for(let i=FL.length-1;i>=0;i--){FL[i].age+=dt;if(FL[i].age>=FL[i].life)FL.splice(i,1);}
  for(let i=SM.length-1;i>=0;i--){const s=SM[i];s.age+=dt;s.x+=G.W*.006*dt;s.y-=G.H*.004*dt;if(s.age>=s.life)SM.splice(i,1);}
}

/* ───────── 그리기 ───────── */
function render(rt,dt){
  const {W,H,dpr,waterTop}=G;
  fx.globalCompositeOperation='destination-out';fx.globalAlpha=1;fx.fillStyle=`rgba(0,0,0,${1-Math.pow(.74,dt*60)})`;fx.fillRect(0,0,W,H);
  fx.globalCompositeOperation='lighter';
  for(const p of P){const f=p.age/p.life;let a=f>.65?(1-f)/.35:1;
    if(p.st&&f>.3)a*=((p.age*13+p.ph)%1)<.45?1:.04;if(p.gl)a*=.45+Math.random()*.55;
    const spr=(p.spr2&&f>.5)?p.spr2:p.spr,s=p.sz;fx.globalAlpha=a;fx.drawImage(spr,p.x-s,p.y-s,s*2,s*2);}
  fx.globalAlpha=1;for(const s of SH){const sz=s.comet?3:2.6;fx.drawImage(s.comet?colSpr(s.cue.c1):SPR.ember,s.x-sz,s.y-sz,sz*2,sz*2);}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.drawImage(bgC,0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(const f of FL){const k=1-f.age/f.life,[r,g,b]=f.rgb;const gr=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);gr.addColorStop(0,`rgba(${r},${g},${b},${.2*k*k})`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);ctx.fillStyle=gr;ctx.fillRect(f.x-f.r,f.y-f.r,f.r*2,f.r*2);}
  ctx.globalCompositeOperation='source-over';
  for(const s of SM){const f=s.age/s.life,a=.09*(1-f)*Math.min(1,s.age*1.5),r=s.r*(1+f*.9);ctx.globalAlpha=a;ctx.drawImage(SPR.smoke,s.x-r,s.y-r,r*2,r*2);}
  ctx.globalAlpha=1;ctx.drawImage(brC,0,0,W,H);
  ctx.globalCompositeOperation='lighter';ctx.drawImage(fxC,0,0,W,H);
  if(S.opts.reflect){ctx.save();ctx.clip(reflPath,'evenodd');const wh=H-waterTop,step=2;
    for(let dy=0;dy<wh;dy+=step){const sy=waterTop-(dy+step)*1.25;if(sy<0)break;const xo=Math.sin(dy*.23+rt*1.8)*(.6+dy*.05)+Math.sin(dy*.07-rt*.9)*1.5;
      ctx.globalAlpha=.34*(1-dy/wh*.7);ctx.drawImage(cv,0,sy*dpr,cv.width,step*1.25*dpr,xo,waterTop+dy,W,step);}
    ctx.restore();}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
}

/* ───────── 소리 ───────── */
let AC=null,NB=null,lastCr=0;
function ensureAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*2;NB=AC.createBuffer(1,n,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();}
function noise(t,dur,type,f0,f1,vol,pan){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur*.7);
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  let out=g;if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=pan;g.connect(p);out=p;}
  s.connect(f).connect(g);out.connect(AC.destination);s.start(t,Math.random());s.stop(t+dur+.05);}
function boom(size,xn){if(!S.opts.sound||!AC||AC.state!=='running')return;const t=AC.currentTime+.02,pan=clamp((xn-.5)*1.4,-1,1);
  noise(t,.7+size*.07,'lowpass',2400,90,.1+size*.02,pan);noise(t,.18,'bandpass',1400,700,.05+size*.006,pan);}
function crackleSnd(){if(!S.opts.sound||!AC||AC.state!=='running')return;const n=performance.now();if(n-lastCr<90)return;lastCr=n;
  for(let i=0;i<5;i++)noise(AC.currentTime+rand(0,.25),.03,'highpass',3000,2500,.025,rand(-.5,.5));}

/* ───────── 큐 → 사건으로 펼치기 ───────── */
let EV=[],EM=[],liveEv=[],liveEm=[];
function expand(c,ev,em){const t0=c.t;
  if(c.site==='sky'){const n=c.pat==='single'?1:c.n,list=[];
    for(let i=0;i<n;i++){const f=n===1?0:i/(n-1);let x=lerp(c.x,c.x2,f),x0=x,at=t0;
      if(c.pat==='single')x=x0=c.x;
      if(c.pat==='chase')at=t0+i*c.gap;
      if(c.pat==='fan'){const d=Math.max(.08,Math.abs(c.x2-c.x));x0=c.x;x=c.x-d+2*d*f;}
      list.push({x0,x,at});}
    if(c.mirror)list.slice().forEach(p=>{if(Math.abs(p.x-.5)>.02||Math.abs(p.x0-.5)>.02)list.push({x0:1-p.x0,x:1-p.x,at:p.at});});
    const rise=riseFor(c.size);list.forEach(p=>ev.push({kind:'shell',launch:p.at-rise,burst:p.at,rise,x0:p.x0,xb:clamp(p.x,.02,.98),cue:c,fired:false}));
    return;}
  let a=Math.min(c.x,c.x2),b=Math.max(c.x,c.x2);if(b-a<.02){a=Math.max(0,c.x-.15);b=Math.min(1,c.x+.15);}
  const ranges=[[a,b]];if(c.mirror&&Math.abs(a-(1-b))>.02)ranges.push([1-b,1-a]);
  for(const[ra,rb]of ranges){
    if(c.shape==='wave'){const n=Math.max(2,c.n),mid=(ra+rb)/2,list=[];
      for(let i=0;i<n;i++){const f=i/(n-1);let x,at;
        switch(c.dir){case'rl':x=lerp(rb,ra,f);at=t0+f*c.dur;break;case'out':x=mid+(i%2?-1:1)*(rb-ra)/2*Math.floor((i+1)/2)/Math.ceil((n-1)/2||1);at=t0+Math.floor((i+1)/2)/Math.ceil(n/2)*c.dur;break;
          case'in':x=(i%2?ra:rb)+(i%2?1:-1)*(rb-ra)/2*Math.floor(i/2)/Math.ceil(n/2);at=t0+Math.floor(i/2)/Math.ceil(n/2)*c.dur;break;case'all':x=lerp(ra,rb,f);at=t0;break;default:x=lerp(ra,rb,f);at=t0+f*c.dur;}
        list.push({x:clamp(x,0,1),at});}
      list.forEach(p=>ev.push({kind:'comet',launch:p.at,burst:p.at+.75,rise:.75,x0:p.x,xb:p.x,cue:c,fired:false}));}
    else em.push({start:t0,end:t0+c.dur,a:ra,b:rb,cue:c});}}
function compile(list){const ev=[],em=[];list.forEach(c=>{if(!c.off)expand(c,ev,em);});return{ev,em};}
function cueEnd(c){if(c.site==='bridge')return c.t+c.dur+(c.shape==='wave'?1:0);return c.t+(c.pat==='chase'?(c.n-1)*c.gap:0)+2.5;}
function showEnd(){return S.cues.reduce((m,c)=>c.off?m:Math.max(m,cueEnd(c)),0);}
function rebuild(){resolveCues();const r=compile(S.cues);EV=r.ev;EM=r.em;const t=Clock.time();EV.forEach(e=>e.fired=e.launch<=t);updCount();}
function schedLive(c,offset){const r=compile([c]);r.ev.forEach(e=>{e.launch+=offset;e.burst+=offset;liveEv.push(e);});r.em.forEach(m=>{m.start+=offset;m.end+=offset;liveEm.push(m);});}
function preview(){ensureAudio();const c=Object.assign({},cur(),{t:0});const r=compile([c]);let m=Infinity;r.ev.forEach(e=>m=Math.min(m,e.launch));r.em.forEach(e=>m=Math.min(m,e.start));if(m===Infinity)m=0;schedLive(c,performance.now()/1000-m);}

/* ───────── 곡 목록(세트리스트) ───────── */
const uid=()=>Math.random().toString(36).slice(2,9);
function normClip(c){return{id:c.id||uid(),vid:c.vid,title:c.title||'',a:+c.a||0,b:+c.b||0,dur:+c.dur||0,bpm:+c.bpm||0,b0:c.b0!=null?+c.b0:null};}
function clipEnd(c){const e=c.b>0?c.b:(c.dur||c.a+60);return Math.max(c.a+1,c.dur?Math.min(e,c.dur):e);}
const clipLen=c=>clipEnd(c)-c.a;
function starts(){let s=0;return S.clips.map(c=>{const v=s;s+=clipLen(c);return v;});}
function musicTotal(){return S.clips.reduce((m,c)=>m+clipLen(c),0);}
function clipAt(T){const st=starts(),n=S.clips.length;for(let i=0;i<n;i++){const e=st[i]+clipLen(S.clips[i]);if(T<e-1e-6||(i===n-1&&T<=e+1e-6))return T>=st[i]-1e-6?i:-1;}return -1;}
function resolveCues(){const st=starts(),idx={};S.clips.forEach((c,i)=>idx[c.id]=i);
  for(const c of S.cues){if(c.k){const i=idx[c.k];if(i==null){delete c.k;delete c.st;c.off=false;continue;}const cl=S.clips[i];c.t=+(st[i]+c.st-cl.a).toFixed(3);c.off=c.st<cl.a-1e-3||c.st>=clipEnd(cl)-1e-3;}else c.off=false;}}
function bindCue(c){const i=clipAt(c.t);if(i>=0){const cl=S.clips[i];c.k=cl.id;c.st=+(cl.a+c.t-starts()[i]).toFixed(3);}else{delete c.k;delete c.st;}c.off=false;}

/* ───────── 유튜브 플레이어 두 대 (다음 곡을 미리 불러 끊김 줄이기) ───────── */
let ytApi=0,ytWait=[];
const slots=[{n:0,vid:'',want:'pause',ready:false,at:0},{n:1,vid:'',want:'pause',ready:false,at:0}];let actN=0;
const act=()=>slots[actN],oth=()=>slots[1-actN];
function needYT(cb){if(ytApi===2){cb();return;}if(ytApi===-1){toast('유튜브에 연결하지 못했어요');return;}ytWait.push(cb);
  if(ytApi===0){ytApi=1;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>{ytApi=-1;ytWait=[];toast('유튜브에 연결하지 못했어요');};document.head.appendChild(s);}}
window.onYouTubeIframeAPIReady=()=>{let k=0;slots.forEach(sl=>{sl.p=new YT.Player('yp'+sl.n,{width:'100%',height:'100%',playerVars:{playsinline:1,rel:0,modestbranding:1},
  events:{onReady:()=>{sl.el=document.getElementById('yp'+sl.n);if(++k===2){ytApi=2;const w=ytWait;ytWait=[];w.forEach(f=>f());}},onStateChange:e=>onYTState(sl,e.data),
    onError:e=>{if(sl!==act())return;toast(e.data===101||e.data===150?'이 영상은 다른 사이트에서 재생할 수 없게 막혀 있어요. 다른 영상으로 바꿔 주세요.':'영상을 재생하지 못했어요 (주소를 확인해 주세요)');if(Clock.playing)Clock.pause();}}});});};
function slotLoad(sl,vid,at,want){sl.vid=vid;sl.want=want;sl.ready=false;sl.at=at;try{(want==='play'||want==='freeplay')?sl.p.unMute():sl.p.mute();sl.p.loadVideoById({videoId:vid,startSeconds:at});}catch(e){}}
function learnMeta(sl){let d=0,ti='';try{d=sl.p.getDuration()||0;const v=sl.p.getVideoData();ti=v&&v.title||'';}catch(e){}let ch=false;
  S.clips.forEach(c=>{if(c.vid!==sl.vid)return;if(d>0&&Math.abs(c.dur-d)>.5){c.dur=d;ch=true;}if(ti&&!c.title){c.title=ti;ch=true;}});if(ch){rebuild();refreshClipEd();save();}}
function onYTState(sl,st){
  if(st===1||st===5)learnMeta(sl);
  if(st===1){
    if(!sl.ready&&(sl.want==='pause'||sl.want==='preload'||sl.want==='free')){sl.ready=true;try{sl.p.pauseVideo();sl.p.seekTo(sl.at,true);}catch(e){}return;}
    sl.ready=true;if(sl.want==='freeplay')sl.want='free';
    if(sl!==act()){try{sl.p.pauseVideo();}catch(e){}return;}
    if(sl.want==='play'){Clock.wait=false;Clock.anchor();}
    else if(sl.want==='free'){try{sl.p.unMute();}catch(e){}}
    else if(sl.want==='pause'&&!Trim.on){Clock.play();}
  }else if(st===3){if(sl===act()&&sl.want==='play')Clock.wait=true;}
  else if(st===2){if(sl===act()&&sl.want==='play'&&Clock.playing&&!Clock.wait){Clock.pause();}}
  else if(st===0){if(sl===act()&&sl.want==='play'&&Clock.playing)Clock.advance();}
  updPlay();}

/* ───────── 쇼 시계 ───────── */
const Trim={on:false,stopAt:0};
const Clock={playing:false,wait:false,T:0,i:-1,aL:0,aN:0,rep:-1,fT:0,fN:0,cueT:0,
  yt(){return S.clips.length>0&&ytApi!==-1;},
  dur(){return this.yt()?musicTotal():Math.max(20,showEnd()+2);},
  anchor(){let v=0;try{v=act().p.getCurrentTime()||0;}catch(e){}this.aL=v;this.rep=v;this.aN=performance.now();},
  local(){const now=performance.now();let rep=this.rep;try{rep=act().p.getCurrentTime()||0;}catch(e){}
    if(rep!==this.rep){this.rep=rep;const est=this.aL+(now-this.aN)/1000;if(Math.abs(est-rep)>.18){this.aL=rep;this.aN=now;}}return this.aL+(now-this.aN)/1000;},
  time(){if(!this.playing)return this.T;
    if(!this.yt()){this.T=this.fT+(performance.now()-this.fN)/1000;return this.T;}
    if(this.wait||this.i<0||ytApi!==2)return this.T;
    const c=S.clips[this.i];if(!c)return this.T;const Lc=this.local();this.T=starts()[this.i]+clamp(Lc-c.a,0,clipLen(c));
    if(Lc>=clipEnd(c)-.03)this.advance();return this.T;},
  play(){ensureAudio();this.exitTrim();if(this.T>=this.dur()-.05)this.T=0;this.playing=true;
    if(!this.yt()){this.fT=this.T;this.fN=performance.now();updPlay();return;}
    this.wait=true;needYT(()=>this.startAt(this.T));updPlay();},
  startAt(T){if(!this.playing)return;const i=clipAt(T);if(i<0){this.pause();return;}const c=S.clips[i],Lc=c.a+(T-starts()[i]);this.i=i;this.T=T;this.wait=true;
    if(act().vid!==c.vid&&oth().vid===c.vid&&oth().ready)this.swap();const sl=act();
    try{oth().want=oth().want==='play'?'preload':oth().want;oth().p.pauseVideo();}catch(e){}
    if(sl.vid===c.vid&&sl.ready){sl.want='play';try{sl.p.unMute();sl.p.seekTo(Lc,true);sl.p.playVideo();}catch(e){}}else slotLoad(sl,c.vid,Lc,'play');
    this.preload(i+1);},
  swap(){const o=act();actN=1-actN;try{o.want='preload';o.p.pauseVideo();o.p.mute();}catch(e){}},
  preload(j){const c=S.clips[j];if(!c)return;const o=oth();if(o.vid===c.vid&&o.ready)return;slotLoad(o,c.vid,c.a,'preload');},
  advance(){const n=this.i+1;if(n>=S.clips.length){this.T=this.dur();this.pause();toast('쇼가 끝났어요');return;}
    const c=S.clips[n];this.i=n;this.T=starts()[n];this.wait=true;const cur=act();cur.want='pause';try{cur.p.pauseVideo();}catch(e){}

  if(shape==='chrys'||shape==='willow'){pts.forEach(([a,b],i)=>{for(let k=1;k<4;k++)dot(cx+a*R*(1-k*.12),cy+b*R*(1-k*.12)+(shape==='willow'?k*1.2:0),.6,.35,i);});}
  if(shape==='multi')sphere(14).forEach(([a,b],i)=>dot(cx+a*R*.42,cy+b*R*.42,1,1,i+5));
  if(shape==='ring'){for(let i=0;i<26;i++){const a=i/26*6.28,px=Math.cos(a),py=Math.sin(a)*.5;pts.push([px*.92-py*.38,px*.38+py*.92]);}}
  if(shape==='saturn'){sphere(16).forEach(([a,b])=>pts.push([a*.48,b*.48]));for(let i=0;i<24;i++){const a=i/24*6.28;pts.push([Math.cos(a),Math.sin(a)*.25]);}}
  if(shape==='palm'){for(let i=0;i<8;i++){const a=i/8*6.28;for(let k=1;k<=5;k++)pts.push([Math.cos(a)*k/5,Math.sin(a)*k/5+(k*k)/60]);}}
  if(shape==='crossette'){for(let i=0;i<6;i++){const a=i/6*6.28;pts.push([Math.cos(a)*.5,Math.sin(a)*.5]);[.8,-.8].forEach(dd=>pts.push([Math.cos(a)*.5+Math.cos(a+dd)*.42,Math.sin(a)*.5+Math.sin(a+dd)*.42]));}}
  if(['heart','star','square','crown','smile','text'].includes(shape))pts=shapePts(shape,shape==='text'?90:40,text).map(([a,b])=>[a*.95,b*.95]);
  pts.forEach(([a,b],i)=>dot(cx+a*R,cy+b*R,shape==='text'?.8:1.15,shape==='strobe'&&i%3?.35:1,i));
  if(shape==='crackle')for(let i=0;i<10;i++){const a=rand(0,6.28),r2=rand(.7,1.05)*R;dot(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2,.7,1,i);}
  if(['niagara','wave','gerb','sparkle'].includes(shape)){const y=h*.42;g.globalAlpha=1;g.fillStyle='#55607f';g.fillRect(2,y,w-4,2.5);
    if(shape==='niagara')for(let x=4;x<w-4;x+=3)for(let k=0;k<4;k++)dot(x+rand(-.5,.5),y+5+k*4+rand(0,2),.8,1-k*.2);
    if(shape==='wave')for(let i=0;i<6;i++){const x=5+i*(w-10)/5,top=y-4-Math.sin(i/5*3.14)*12;for(let k=0;k<4;k++)dot(x,y-2-k*(y-2-top)/4,.7,.5);dot(x,top,1.6);}
    if(shape==='gerb')for(let gx=8;gx<w;gx+=14)for(let k=0;k<14;k++){const a=rand(-.5,.5),r2=rand(3,13);dot(gx+Math.sin(a)*r2,y-Math.cos(a)*r2+r2*r2/30,.7);}
    if(shape==='sparkle')for(let i=0;i<9;i++)dot(rand(4,w-4),y-rand(0,5),rand(.8,1.8));}
  g.globalAlpha=1;}
const swEl1=$('#sw1'),swEl2=$('#sw2');
function buildSw(el,key,withNone){el.innerHTML='';if(withNone){const b=document.createElement('button');b.dataset.v='';b.title='바뀌지 않음';b.style.background='repeating-linear-gradient(45deg,#1a2038 0 4px,#0c1020 4px 8px)';b.onclick=()=>setF(key,'');el.appendChild(b);}
  Object.entries(COLORS).forEach(([k,[l,h]])=>{if(withNone&&k==='rainbow')return;const b=document.createElement('button');b.dataset.v=k;b.title=l;
    b.style.background=h||'linear-gradient(90deg,#ff4242,#ffc65c,#52ff80,#4d86ff,#b965ff)';b.onclick=()=>{setF(key,k);};el.appendChild(b);});

Object.entries(rng).forEach(([id,k])=>{const el=$('#'+id);el.addEventListener('input',()=>setF(k,+el.value));el.addEventListener('change',()=>{if(S.sel<0)preview();});});
$('#itext').addEventListener('input',e=>setF('text',e.target.value||'★'));

$$('[data-nudge]').forEach(b=>b.onclick=()=>nudge(+b.dataset.nudge));
function nudge(d){if(S.sel<0)return;setF('t',+Math.max(0,cur().t+d).toFixed(3));}
$$('.tgs .tg').forEach(b=>b.onclick=()=>setF(b.dataset.f,!cur()[b.dataset.f]));
const vis=(el,on)=>{el.style.display=on?'':'none';};
function refreshTime(){if(S.sel>=0&&document.activeElement!==$('#it'))$('#it').value=cur().t.toFixed(2);
  $('#editLbl').innerHTML=S.sel>=0?`<span class="sel">선택한 불꽃 · ${fmt(cur().t)}</span>`:'새 불꽃 설정';}

  $$('#sw1 button').forEach(b=>b.classList.toggle('on',b.dataset.v===c.c1));$$('#sw2 button').forEach(b=>b.classList.toggle('on',b.dataset.v===c.c2));

  $$('[data-show]').forEach(el=>{const k=el.dataset.show;let on=true;
    if(k==='sky')on=sky;else if(k==='bridge')on=!sky;else if(k==='x2')on=!sky||c.pat!=='single';else if(k==='n')on=(sky&&c.pat!=='single')||(!sky&&c.shape==='wave');
    else if(k==='gap')on=sky&&c.pat==='chase';else if(k==='dur')on=!sky;else if(k==='text')on=sky&&c.shape==='text';else if(k==='sel')on=S.sel>=0;vis(el,on);});
  $('#lx').textContent=sky?(c.pat==='fan'?'발사 위치':c.pat==='single'?'위치':'시작 위치'):'구간 시작';$('#lx2').textContent=sky?(c.pat==='fan'?'펼침 폭':'끝 위치'):'구간 끝';

  vis($('#bDesel'),S.sel>=0);vis($('#bDel'),S.sel>=0);$('#bAdd').textContent=S.sel>=0?'＋ 복사해서 지금 넣기':'＋ 지금 시각에 넣기';
  refreshTime();

  $$('#panelL .tg').forEach(b=>b.classList.toggle('on',!!S.opts[b.dataset.o]));
  if(document.activeElement!==$('#bpm')){const bc=beatClip();$('#bpm').value=bc?(bc.bpm||''):S.bpm;$('#bpm').placeholder='—';$('#bpm').title=bc?`${S.clips.indexOf(bc)+1}번째 곡의 빠르기`:'빠르기';}}
function updCount(){const n=S.cues.filter(c=>!c.off).length,m=S.clips.length;$('#count').textContent=(m?`곡 ${m}개 · 음악 ${fmtS(musicTotal())} · `:'')+(n?`불꽃 큐 ${n}개`:'아직 큐가 없어요');}

/* ───────── 화면 보조 ───────── */
let toastT=0;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function updPlay(){const s=Clock.playing?'⏸':'▶';$('#bPlay').textContent=s;$('#mPlay').textContent=s;}
let lastTm='';function updHUD(t){const s=fmt(t)+(Clock.yt()?' / '+fmtS(Clock.dur()):'');if(s!==lastTm){$('#tm').textContent=s;lastTm=s;}}
function slotVisible(el){const r=el.getBoundingClientRect();return r.width>20&&r.top>=-1&&r.bottom<=innerHeight+1&&getComputedStyle(el).display!=='none';}
let ybLast='';function placeYT(){const box=$('#ytBox');const show=S.clips.length>0&&ytApi===2;box.style.display=show?'block':'none';if(!show){document.body.classList.remove('ytmini');return;}
  slots.forEach(sl=>sl.el&&sl.el.classList.toggle('on',sl===act()));
  const slot=$('#ytSlot');const useSlot=slotVisible(slot);document.body.classList.toggle('ytmini',!useSlot);const r=(useSlot?slot:$('#ytMini')).getBoundingClientRect();
  const k=`${r.left|0},${r.top|0},${r.width|0},${r.height|0}`;if(k!==ybLast){ybLast=k;Object.assign(box.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});}}

/* ───────── 메인 루프 ───────── */
let lastR=performance.now()/1000,lastT=0,clipTick=0,waitSince=0,waitWarned=false;
function frame(now){const rnow=now/1000,dt=Math.min(.1,Math.max(0,rnow-lastR));lastR=rnow;
  const t=Clock.time();let mdt=t-lastT;if(mdt<-.02||mdt>.6){resync(t);mdt=0;}
  if(Clock.playing){for(const e of EV)if(!e.fired&&e.launch<=t){e.fired=true;if(t<e.burst+.3)fireShell(e,t-e.launch);}
    for(const m of EM)if(t>=m.start&&t<m.end)runEmitter(m,t,Math.max(0,Math.min(.05,mdt)));
    if(View.len<total()&&(t>View.start+View.len*.9||t<View.start))View.start=clamp(t-View.len*.1,0,Math.max(0,total()-View.len));}
  lastT=t;
  for(let i=liveEv.length-1;i>=0;i--){const e=liveEv[i];if(rnow>=e.launch){fireShell(e,rnow-e.launch);liveEv.splice(i,1);}}
  for(let i=liveEm.length-1;i>=0;i--){const m=liveEm[i];if(rnow>=m.end){liveEm.splice(i,1);continue;}if(rnow>=m.start)runEmitter(m,rnow,dt);}
  if(!Clock.yt()&&Clock.playing&&t>=Clock.dur()){Clock.playing=false;Clock.T=Clock.dur();updPlay();}
  if(Trim.on&&Trim.stopAt&&ytApi===2){let st=0;try{st=act().p.getCurrentTime();}catch(e){}if(st>=Trim.stopAt){try{act().p.pauseVideo();}catch(e){}Trim.stopAt=0;}}
  if(Clock.playing&&Clock.wait){if(!waitSince)waitSince=rnow;else if(rnow-waitSince>3.5&&!waitWarned){waitWarned=true;toast('영상이 멈춰 있으면 영상 화면을 한 번 눌러 주세요');}}else waitSince=0;
  update(dt);render(rnow,dt);drawTL(t);updHUD(t);placeYT();if(++clipTick%12===0)updListenBtn();
  requestAnimationFrame(frame);}

/* ───────── 이벤트 연결 ───────── */
function bind(){
  seg($('#segSite'),[['sky','하늘 (바지선)'],['bridge','다리 위']],'site');
  seg($('#segSize'),SIZES.map(s=>[s,s+'호',s+'인치 크기']),'size');
  seg($('#segPat'),PATS,'pat');seg($('#segDir'),DIRS,'dir');
  const ss=$('#segSnap');[[0,'끔'],[1,'1박'],[2,'½박'],[4,'¼박']].forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.v=v;b.onclick=()=>{S.snap=v;save();refreshPanel();};ss.appendChild(b);});
  buildSw(swEl1,'c1',false);buildSw(swEl2,'c2',true);
  $$('.ptabs button').forEach(b=>b.onclick=()=>{document.body.dataset.p=b.dataset.p;$$('.ptabs button').forEach(x=>x.classList.toggle('on',x===b));});
  $$('.ptabs button')[0].classList.add('on');
  $$('#sheetTabs [data-s]').forEach(b=>b.onclick=()=>setSheet(b.dataset.s));
  $('#sheetClose').onclick=()=>document.body.classList.remove('open');
  $('#mEdit').onclick=()=>{const o=document.body.classList.toggle('open');$('#mEdit').textContent=o?'닫기 ▼':'편집 ▲';};
  $('#sheetClose').addEventListener('click',()=>{$('#mEdit').textContent='편집 ▲';});
  for(const id of ['bPlay','mPlay'])$('#'+id).onclick=()=>Clock.toggle();
  for(const id of ['bHome','mHome'])$('#'+id).onclick=()=>{Clock.seek(0);View.start=0;};
  for(const id of ['bTap','mTap','bAdd'])$('#'+id).onclick=tapAdd;
  for(const id of ['bPrev','mPrev'])$('#'+id).onclick=preview;
  $('#bUndo').onclick=undo;$('#bDel').onclick=delSel;$('#bDesel').onclick=()=>selectCue(-1);
  $('#bYt').onclick=addClipFromInput;
  $('#ytUrl').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addClipFromInput();}});
  const ia=$('#clipA'),ib=$('#clipB');
  ia.addEventListener('pointerdown',()=>pushUndo(true));ib.addEventListener('pointerdown',()=>pushUndo(true));
  ia.addEventListener('input',()=>{const c=S.clips[S.csel];if(!c)return;setClipAB(+ia.value,clipEnd(c),'a');trimSeek(c.a);});
  ib.addEventListener('input',()=>{const c=S.clips[S.csel];if(!c)return;setClipAB(c.a,+ib.value,'b');trimSeek(Math.max(c.a,clipEnd(c)-.5));});
  ia.addEventListener('change',()=>{const c=S.clips[S.csel];if(c)trimListen(c.a,Math.min(clipEnd(c),c.a+5));ia.blur();});
  ib.addEventListener('change',()=>{const c=S.clips[S.csel];if(c)trimListen(Math.max(c.a,clipEnd(c)-4),clipEnd(c));ib.blur();});
  $('#bClipA').onclick=()=>markNow('a');$('#bClipB').onclick=()=>markNow('b');
  $('#bListen').onclick=()=>{const c=S.clips[S.csel];if(!c)return;if(Trim.on&&trimPlaying()){try{act().p.pauseVideo();}catch(e){}Trim.stopAt=0;return;}trimListen(c.a,clipEnd(c));};
  $('#bCPrev').onclick=()=>moveClip(-1);$('#bCNext').onclick=()=>moveClip(1);$('#bCDel').onclick=delClip;
  $('#bpm').addEventListener('change',e=>{const v=clamp(+e.target.value||120,40,240),c=beatClip();if(c)c.bpm=v;else S.bpm=v;save();refreshPanel();});
  $('#bTempo').onclick=tapTempo;
  $('#bBeat0').onclick=()=>{const c=beatClip();if(c){const st=songNow(c);if(st==null){toast('곡을 재생하면서 눌러 주세요');return;}c.b0=+st.toFixed(3);if(!c.bpm)c.bpm=S.bpm;}else S.beat0=+Clock.time().toFixed(3);save();refreshPanel();toast('첫 박을 정했어요');};
  $('#bEx').onclick=()=>{pushUndo(true);S.cues=EXAMPLE.map(norm);S.sel=-1;rebuild();refreshPanel();save();Clock.seek(0);View.start=0;View.len=Math.max(30,showEnd()+2);toast('예시 쇼를 불러왔어요 · ▶ 재생');};
  $('#bNew').onclick=()=>{if(!S.cues.length&&!S.clips.length)return;pushUndo(true);Clock.pause();Clock.exitTrim();S.cues=[];S.clips=[];S.csel=-1;S.sel=-1;Clock.T=0;refreshClipEd();rebuild();refreshPanel();save();toast('모두 지웠어요 · ↶로 되돌릴 수 있어요');};

  $$('#panelL .tg').forEach(b=>b.onclick=()=>{S.opts[b.dataset.o]=!S.opts[b.dataset.o];if(b.dataset.o==='smoke'&&!S.opts.smoke)SM=[];save();refreshPanel();});
  addEventListener('pointerdown',ensureAudio,{passive:true});
  addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'&&e.target.type!=='range')return;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}
    if(e.code==='Space'){e.preventDefault();Clock.toggle();}
    else if(e.key==='Enter'){e.preventDefault();tapAdd();}
    else if(e.key==='Delete'||e.key==='Backspace'){if(S.sel>=0){e.preventDefault();delSel();}}
    else if(e.key==='Escape'){selectCue(-1);document.body.classList.remove('open');}
    else if(e.key==='p'||e.key==='P'||e.key==='ㅔ'){preview();}
    else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const d=(e.key==='ArrowLeft'?-1:1)*(e.shiftKey?.5:.05);if(S.sel>=0)nudge(d);else Clock.seek(Clock.time()+d*4);}});
  new ResizeObserver(()=>{layout();tlSize();}).observe($('#stage'));
  new ResizeObserver(tlSize).observe(tl);
}
function setSheet(s){document.body.dataset.s=s;if(s!=='L'){document.body.dataset.p=s;$$('.ptabs button').forEach(x=>x.classList.toggle('on',x.dataset.p===s));}
  $$('#sheetTabs [data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===s));}

/* ───────── 시작 ───────── */
function init(){initSpr();bind();setSheet('A');layout();tlSize();
  let loaded=false;const h=location.hash.match(/#s=([\w-]+)/);
  if(h){try{loaded=unpack(JSON.parse(b64d(h[1])));if(loaded)toast('공유받은 쇼를 불러왔어요');}catch(e){}}
  if(!loaded){try{const s=localStorage.getItem(KEY);if(s)loaded=unpack(JSON.parse(s));}catch(e){}}
  const fresh=!loaded||(!S.cues.length&&!S.clips.length);if(fresh)S.cues=EXAMPLE.map(norm);
  rebuild();refreshPanel();refreshClipEd();View.len=S.clips.length?Math.max(30,Math.min(90,total())):Math.max(30,Math.min(60,showEnd()+2));
  if(S.clips.length)needYT(()=>Clock.cueLater(0));
  const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!calm){if(fresh)Clock.play();else{[[.3,'gold',.25],[.5,'blue',.6],[.7,'pink',.95]].forEach(([x,c1,d])=>schedLive(norm({x,x2:x,c1,size:7,shape:'peony'}),performance.now()/1000+d-riseFor(7)));}}

init();
